[project]
name = "nlcare-medical-agent"
version = "0.0.0"
description = "Synthetic-only, nonclinical healthcare AI engineering prototype"
readme = "README.md"
requires-python = ">=3.11,<3.15"
# The minimal runtime profile: what the serving container actually needs to
# answer requests. Anything heavier belongs to a dependency group below, so the
# serving image can be built with `--no-default-groups` instead of being
# described by a second, hand-maintained manifest.
dependencies = [
  "alembic==1.18.4",
  "faiss-cpu==1.13.2",
  "fastapi==0.136.1",
  "google-genai==2.0.0",
  "groq==1.2.0",
  "joblib==1.5.3",
  "nibabel==5.4.2",
  "numpy==2.4.4",
  "openpyxl==3.1.5",
  "pandas==3.0.2",
  "pillow==12.3.0",
  "psycopg2-binary==2.9.12",
  "pydicom==3.0.2",
  "pyjwt[crypto]==2.13.0",
  "python-json-logger==4.0.0",
  "pypdf==6.15.0",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "rank-bm25==0.2.2",
  "redis==8.0.1",
  "scikit-learn==1.8.0",
  "setuptools==83.0.0",
  "sqlalchemy==2.0.49",
  "uvicorn[standard]==0.46.0",
]

[dependency-groups]
# Training, embedding, and explainability. Excluded from the serving image:
# these are the largest wheels in the tree and nothing on the request path
# imports them.
ml = [
  "sentence-transformers==5.4.1",
  "shap==0.51.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
]
# Figure and document generation for evidence artifacts. Runs in development,
# evaluation, and CI; never on the serving request path.
reporting = [
  "matplotlib==3.10.9",
  "reportlab==5.0.0",
]
dev = [
  "mypy==2.3.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "types-pyyaml==6.0.12.20250915",
]

[tool.uv]
package = false
# `uv sync --frozen` must keep giving a developer and CI the full environment
# they had when these packages were plain runtime dependencies. Splitting them
# into groups is about letting the *serving* image opt out
# (`uv sync --frozen --no-default-groups`), not about shrinking the default.
default-groups = ["dev", "ml", "reporting"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "Data",
  "Datasets",
  "artifacts",
  "frontend-react",
  "node_modules",
  "output",
  "tmp",
]

[tool.ruff.lint]
# Rule families are chosen for signal, not breadth. Each addition below was
# measured against the tree before being enabled, and every resulting violation
# was fixed rather than ignored.
#
#   E4  import placement/format (E401 multiple-imports; E402 see per-file below)
#   E7  statement-level correctness: `== True`, `is` on literals, bare `except`,
#       multiple statements per line, ambiguous names
#   E9  syntax and runtime errors
#   F   full pyflakes: unused imports and variables, undefined names,
#       f-strings with no placeholders, star-import hazards
#   B   flake8-bugbear: real bug patterns (loop-variable capture, iterator
#       shadowing, duplicate literals in collections)
#
# Deliberately NOT enabled, with measured reasons:
#   E501 line-too-long        6,762 hits — pure reformatting, no defect signal
#   I    import sorting         959 hits — ordering churn across nearly every
#                                          file with no behavioural benefit
#   UP   pyupgrade              756 hits — 535 are `timezone.utc` -> `UTC`
#                                          cosmetics; no correctness gain
#   SIM  flake8-simplify         64 hits — refactors live code for style; higher
#                                          risk than value in a safety-critical
#                                          path, and not mechanical
# These are recorded as tracked debt, not as a claim that the code is clean
# under them.
select = ["E4", "E7", "E9", "F", "B"]

ignore = [
  # FastAPI's dependency-injection idiom is `param: X = Depends(...)`, which is
  # a function call in a default argument by construction. 301 of the 357
  # bugbear hits are this pattern; every one is a false positive here.
  "B008",
  # zip-without-explicit-strict. 39 sites. Left enabled-but-ignored rather than
  # bulk-fixed on purpose: the autofix writes `strict=False`, which would
  # freeze today's silent-truncation behaviour into the source. In a codebase
  # that zips predictions against labels, whether truncation is intended is a
  # per-call-site question that needs review, not a blanket rewrite.
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# E402 (module import not at top of file) is deliberate in these places, not an
# oversight. Exemptions are listed explicitly so the rule still protects every
# other module, and so a reviewer can see the complete set.

# Standalone entry points bootstrap `sys.path` to the repository root before
# importing `backend.*`; the import cannot precede the path setup.
"scripts/**" = ["E402"]
"backend/services/dep001c_snapshot_worker.py" = ["E402"]
"backend/services/dep001d_snapshot_worker.py" = ["E402"]

# Late imports that break genuine circular dependencies between a module and
# the helpers that import back into it.
"backend/api/routers/patient.py" = ["E402"]
"backend/services/admin_analytics.py" = ["E402"]
"backend/services/support_chat_agent.py" = ["E402"]
"backend/services/support_chat_response.py" = ["E402"]

# Tests import fixtures after adjusting paths or setting environment flags that
# must be in place before the module under test is imported.
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
  "backend/api/schemas/common.py",
  "backend/api/schemas/model.py",
  "backend/config.py",
  "backend/services/safety_policy_action.py",
  "backend/services/structured_logging.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/migrations/*"]

[tool.coverage.report]
# Regression floor, not a target. Branch-aware backend coverage has measured
# 69.90% on six consecutive full-suite runs, so 60 leaves ~10 points of
# headroom for ordinary churn while still failing a real regression. Raise it
# as coverage genuinely improves; never lower it to make a build pass.
fail_under = 60
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
