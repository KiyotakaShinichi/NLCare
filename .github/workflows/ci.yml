name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      # Full history: the change-discipline check diffs against a base ref.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      # uv creates the environment; `.venv/bin` then goes on PATH so every
      # later step invokes the tools directly. Same venv, same interpreter,
      # same locked versions as `uv run` — but one shape across all jobs
      # instead of two, and the command that runs is the command you read.
      - name: Sync frozen Python environment
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate Python dependency contract
        run: |
          uv lock --check
          python scripts/check_dependency_contract.py
          python scripts/check_env_documentation.py
          python -m pip check

      # A 900-line service has no seam a reviewer can hold in their head. The
      # limit is a ratchet, not a flat ban: pre-existing offenders are frozen
      # at their current size in tests/contracts/backend_loc_baseline.json and
      # may only shrink, while anything new must come in under 500. That way
      # the debt cannot grow and unrelated legacy files do not fail `main`.
      - name: Enforce backend service size limits
        run: python scripts/check_file_size.py backend/services --max-loc 500

      # Production changes ship with tests. `fetch-depth: 0` above gives the
      # diff something to compare against; on a pull request that is the merge
      # base, on a push it is the previous commit.
      - name: Require tests alongside service changes
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] &&                git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Comparing $BASE...HEAD"
          python scripts/check_change_discipline.py --base "$BASE" --head HEAD

      # The CI checkout is itself a fresh clone with no `.env`, so this is the
      # one place the offline-reproducibility contract can be proven rather
      # than asserted: it fails if the offline path ever starts depending on an
      # untracked or gitignored file.
      # `--provision` is what makes this gate able to catch the defect class it
      # previously missed: it rebuilds the gitignored derived artifacts from
      # tracked inputs and then runs a consumer test against the result. Seven
      # tests passed locally and failed on every fresh clone because nothing
      # verified those artifacts were reproducible. This job is the fast lane,
      # so the failure now surfaces here rather than in full-offline-tests.
      - name: Verify fresh-clone offline contract
        run: |
          python scripts/check_fresh_clone_offline.py \
            --provision \
            --run-tests \
            --json-output Data/test_tmp/fresh_clone_offline_check.json

      - name: Upload fresh-clone offline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-clone-offline-check
          path: Data/test_tmp/fresh_clone_offline_check.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Ruff
        run: ruff check backend scripts tests
      - name: Incremental mypy
        run: mypy
      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci
      - name: Frontend lint
        working-directory: frontend-react
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend-react
        run: npm run typecheck

      # Runs in the fast lane as well as in quality-gates. quality-gates only
      # starts after the full offline backend suite and the dependency audit,
      # so without this a frontend-only regression is not reported for tens of
      # minutes. This step is also the frontend coverage gate: `test:coverage`
      # runs vitest with the thresholds declared in `coverage.thresholds` in
      # frontend-react/vitest.config.ts and exits non-zero when any is missed,
      # so a coverage regression fails this job rather than merely being
      # reported in the uploaded artifact.
      - name: Frontend unit tests and coverage gate
        working-directory: frontend-react
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend-react/coverage
          if-no-files-found: ignore
          retention-days: 7

  # A clean checkout, bootstrapped from nothing: no restored virtualenv and no
  # restored node_modules. `npm ci` and `uv sync --frozen` install from the
  # lockfiles, which is the property being proven. The Hugging Face cache is
  # restored because the safety encoder is a 480 MB model download, not a
  # project dependency - the provisioning step below fetches it when absent.
  fresh-clone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: sqlite:///./Data/test_tmp/full_suite.db
      ENVIRONMENT: test
      LLM_ADJUDICATION_ENABLED: "false"
      RAG_FORCE_SPARSE: "true"
      RAG_ENABLE_CROSS_ENCODER: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      # Full history, not the default shallow checkout. This job runs the whole
      # tests tree, and the ML decomposition suites prove equivalence against
      # the pre-refactor module by loading it with `git show <commit>:<path>`.
      # Under a depth-1 clone that object does not exist, the loader raises at
      # import time, and pytest reports one collection error and runs nothing
      # at all - 2498 tests collected, zero executed.
      #
      # Deepening the clone rather than teaching the test to skip is deliberate:
      # a skip would quietly retire the equivalence check in the one job that
      # runs every test file, which is the kind of invisible gap this job exists
      # to catch. A real `git clone` has full history anyway, so this is also
      # closer to the fresh checkout the job is simulating.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # uv creates the environment; `.venv/bin` then goes on PATH so every
      # later step invokes the tools directly. Same venv, same interpreter,
      # same locked versions as `uv run` — but one shape across all jobs
      # instead of two, and the command that runs is the command you read.
      - name: Sync frozen Python environment
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The DEP-001 safety runtimes load their base encoder with
      # `local_files_only=True`. On a fresh runner the Hugging Face cache is
      # empty, that call raises, and the runtime correctly FAILS CLOSED — which
      # made ~89 tests asserting that benign prompts stay `low_risk` fail. The
      # encoder is fetched once here, with the offline flags lifted for this
      # step only; the test run below still executes fully offline.
      - name: Cache Hugging Face encoders
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-safety-encoders-${{ hashFiles('config/dep001*_semantic_safety.yaml') }}
          restore-keys: |
            hf-safety-encoders-

      - name: Provision semantic safety encoders
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: python scripts/provision_semantic_safety_encoders.py

      # Preflight guard. `--verify-runtimes` is essential, not decorative: an
      # encoder-only check exits 0 while a DEP-001 runtime is fully degraded,
      # because each runtime also loads joblib artifacts, verifies their
      # SHA-256, and checks the embedding dimension — and every one of those
      # fails *closed* rather than raising. That combination is what let the
      # suite fail ~88 tests while verification reported success.
      - name: Verify safety runtimes load offline
        run: |
          python scripts/provision_semantic_safety_encoders.py \
            --check-only \
            --verify-runtimes \
            --json-output Data/test_tmp/semantic_safety_provisioning.json

      - name: Upload safety provisioning evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-safety-provisioning
          path: Data/test_tmp/semantic_safety_provisioning.json
          if-no-files-found: ignore
          retention-days: 14

      # The suite consumes derived artifacts that are gitignored on purpose
      # (a RAG index, the KB chunk file, the lakehouse gold records). A fresh
      # runner has none of them, which is why ~5 tests failed here while
      # passing on developer machines that still had last month's copies.
      # Rebuilt from tracked inputs; no network, so the suite below stays
      # fully offline.
      - name: Provision derived offline artifacts
        run: |
          mkdir -p Data/test_tmp
          python scripts/provision_derived_artifacts.py \
            --json-output Data/test_tmp/derived_artifact_provisioning.json
          python scripts/provision_derived_artifacts.py --check-only

      # Class B: an external tool, not project data. `cloud_infrastructure_
      # readiness` shells out to the Bicep CLI to compile the checked-in
      # template, and reports `needs_attention` when it is absent. Pinned
      # rather than latest so a Bicep release cannot change a CI result.
      - name: Install Bicep CLI
        env:
          BICEP_VERSION: v0.45.15
        run: |
          curl -fsSL -o /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Upload derived artifact provisioning evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: derived-artifact-provisioning
          path: Data/test_tmp/derived_artifact_provisioning.json
          if-no-files-found: ignore
          retention-days: 14

      # Keeps CI and the documented one-command setup from drifting apart.
      # CI deliberately keeps its steps separate — per-step env (the encoder
      # download is the only step allowed network) and per-step failure
      # attribution are what make a red run diagnosable. `bootstrap.py --check`
      # asserts that the path a contributor is told to run agrees with what CI
      # actually did, without duplicating the steps themselves.
      - name: Verify documented bootstrap agrees with CI setup
        run: python scripts/bootstrap.py --check

      # The canonical offline verification. This runs the *complete* tests tree
      # with branch coverage, and additionally accounts for the thing a bare
      # pytest invocation cannot: whether the suite was actually hermetic. It
      # strips every live provider credential, refuses to inherit
      # NLCARE_ALLOW_TEST_NETWORK, and fails if any test skipped because a
      # network or credential was unavailable — a skip is invisible in a green
      # summary line, which is how a suite quietly shrinks. It reports the
      # discovered test-file count, the collected test count, and the
      # pass/fail/skip split, so the hermetic claim is checkable rather than
      # asserted.
      # The end-to-end fresh-clone contract: bootstrap both stacks, run the
      # backend suite hermetically, build the frontend, print FRESH CLONE OK.
      # The script delegates the suite to check_fresh_clone_offline.py, so
      # `python -m pytest tests -q --cov=backend --cov-branch
      # --cov-fail-under=60` executes exactly once in this workflow.
      - name: Verify fresh clone end to end
        run: |
          mkdir -p Data/test_tmp
          sh scripts/verify_fresh_clone.sh

      - name: Upload full-suite hermetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-clone-full-suite
          path: Data/test_tmp/fresh_clone_full_suite.json
          if-no-files-found: ignore

  # Deterministic ML regression. No training, no model download, no network:
  # these suites run the perturbation evaluation and the patient-grouped
  # temporal cross-validation against committed synthetic fixtures with fixed
  # seeds, and assert the metrics and thresholds that decide promotion. They
  # are the fast signal that an ML change moved a number it should not have.
  ml-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RAG_FORCE_SPARSE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Sync frozen Python environment
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: ML metric regression suites
        run: |
          mkdir -p Data/test_tmp
          python -m pytest             tests/test_synthetic_model_perturbation_modules.py             tests/test_synthetic_model_perturbation_retrain_eval.py             tests/test_patient_temporal_cv.py             -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      # `export PATH=` rather than `$GITHUB_PATH` here: this job syncs and runs
      # the tool inside a single step, and `$GITHUB_PATH` only takes effect for
      # *subsequent* steps. Same venv either way.
      - name: Audit frozen Python production dependencies
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen
          export PATH="$PWD/.venv/bin:$PATH"
          uv export --frozen --no-dev --format requirements-txt --no-hashes --quiet \
            --output-file /tmp/nlcare-production-requirements.txt
          pip-audit -r /tmp/nlcare-production-requirements.txt \
            --no-deps --disable-pip --progress-spinner off --timeout 60
      - name: Audit frontend dependencies
        working-directory: frontend-react
        run: |
          npm ci
          npm audit --audit-level=high

  quality-gates:
    runs-on: ubuntu-latest
    needs: [static-quality, fresh-clone-smoke, dependency-audit]
    env:
      DATABASE_URL: sqlite:///./Data/test_tmp/ci_medical_agent.db
      LLM_ADJUDICATION_ENABLED: "false"
      RAG_FORCE_SPARSE: "true"
      RAG_ENABLE_CROSS_ENCODER: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Same requirement as full-offline-tests: the safety runtimes load their
      # encoder with `local_files_only=True`, so it must be in the cache even
      # though this job does not set the offline flags. Without it the safety
      # eval scripts below run against fail-closed defaults.
      - name: Cache Hugging Face encoders
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-safety-encoders-${{ hashFiles('config/dep001*_semantic_safety.yaml') }}
          restore-keys: |
            hf-safety-encoders-

      - name: Provision semantic safety encoders
        run: python scripts/provision_semantic_safety_encoders.py

      # See full-offline-tests: the encoder-only form of this check passes
      # while a runtime is degraded, so the runtime probe is required.
      - name: Verify safety runtimes load offline
        run: python scripts/provision_semantic_safety_encoders.py --check-only --verify-runtimes

      # Same requirement as full-offline-tests: the legacy monitoring
      # regression below runs the RAG path, which needs the derived index.
      - name: Provision derived offline artifacts
        run: |
          mkdir -p Data/test_tmp
          python scripts/provision_derived_artifacts.py
          python scripts/provision_derived_artifacts.py --check-only

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Secret scan
        run: python scripts/ci_secret_scan.py

      - name: Compile backend and scripts
        run: python -m compileall backend scripts

      - name: Backend unit and regression tests
        run: |
          mkdir -p Data/test_tmp
          python -m pytest \
            tests/test_constants_sync.py \
            tests/test_timeline_uncertainty.py \
            tests/test_safety_eval_center.py \
            tests/test_access_control.py \
            tests/test_model_route_authorization.py \
            tests/test_public_imaging_services.py

      - name: Legacy full monitoring regression
        run: python -m unittest tests/test_breast_monitoring.py

      - name: Frontend TypeScript build
        working-directory: frontend-react
        run: npm run build

      - name: Frontend unit tests
        working-directory: frontend-react
        run: npm run test

      - name: Export OpenAPI schema and verify frontend API types
        run: |
          python scripts/export_openapi_schema.py
          cd frontend-react
          npm run typegen:file
          git diff --exit-code src/types/generated-openapi.d.ts

      - name: Knowledge-base ingestion smoke
        run: |
          mkdir -p KnowledgeBase/raw Data/test_tmp
          printf "# Breast cancer chemotherapy\n\nCBC monitoring can help track WBC, hemoglobin, platelets, and treatment toxicity." > KnowledgeBase/raw/ci_smoke.md
          python scripts/ingest_knowledge_base.py --input-dir KnowledgeBase/raw --output-path Data/test_tmp/rag_chunks.json

      - name: Agent RAG regression suite
        run: python scripts/evaluate_agent_rag.py --output-path Data/test_tmp/agent_regression.json --max-cases 8

      - name: RAG gold-set evaluation
        run: python scripts/evaluate_rag_gold_set.py --output-path Data/test_tmp/rag_gold_eval.json --print-summary

      - name: Safety evaluation center
        run: python scripts/run_safety_eval_center.py --print-summary

      - name: MLE readiness checks
        run: python scripts/run_mle_checks.py --output-path Data/test_tmp/mle_readiness.json

      - name: Synthetic-only hardening artifacts
        run: |
          python scripts/run_taglish_safety_parity.py
          python scripts/run_rag_intent_aware_eval.py
          python scripts/run_rag_tier_ablation.py
          python scripts/run_rag_claim_validation_eval.py
          python scripts/run_nli_claim_validation_eval.py
          python scripts/run_live_rag_eval.py
          python scripts/run_learned_abstention_experiment.py
          python scripts/run_learned_abstention_eval.py
          python scripts/run_soft_toxicity_target_benchmark.py
          python scripts/run_hybrid_subgroup_metrics.py
          python scripts/run_synthetic_realism_hardening.py
          python scripts/run_self_supervised_timeline_pretraining.py
          python scripts/run_counterfactual_stability_eval.py
          python scripts/run_per_head_calibration.py
          python scripts/run_shortcut_audit.py
          python scripts/run_minimum_evidence_standards.py
          python scripts/run_medical_claim_boundary_eval.py
          python scripts/build_medical_advisor_review_packet.py

      - name: Release gate
        run: python scripts/run_release_gate.py

      - name: Frontend Playwright smoke
        working-directory: frontend-react
        run: |
          npx playwright install chromium
          npm run test:e2e -- tests/e2e/smoke.spec.ts

      - name: API smoke checks
        run: |
          python -m uvicorn backend.api.main:app --host 127.0.0.1 --port 8017 &
          echo $! > uvicorn.pid
          trap "kill $(cat uvicorn.pid)" EXIT
          sleep 8
          python scripts/api_smoke.py

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend Docker image
        run: docker build -t medical-agent:ci .
