name: Ship Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./Data/test_tmp/ship_medical_agent.db
      ENVIRONMENT: development
      LLM_ADJUDICATION_ENABLED: "false"
      RAG_FORCE_SPARSE: "true"
      RAG_ENABLE_CROSS_ENCODER: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/bicep \
            https://github.com/Azure/bicep/releases/download/v0.45.15/bicep-linux-x64
          echo "ff5b194b042c220df4a50d6768ed1d6c39a32894bfdc4ff83d62b115d966a7ce  /tmp/bicep" \
            | sha256sum --check
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Install backend dependencies
        run: |
          python -m pip install uv==0.8.24
          uv sync --frozen

      # ship.py runs the safety contract test suites, which load the DEP-001
      # encoder with `local_files_only=True`. Without it in the cache those
      # runtimes fail closed and the safety steps fail for an environment
      # reason rather than a real regression. This provisions the environment;
      # it does not change any release criterion.
      - name: Cache Hugging Face encoders
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-safety-encoders-${{ hashFiles('config/dep001*_semantic_safety.yaml') }}
          restore-keys: |
            hf-safety-encoders-

      - name: Provision semantic safety encoders
        run: uv run python scripts/provision_semantic_safety_encoders.py

      # Runtime probe, not just the encoder: ship.py runs the safety contract
      # suites, and an encoder-only check passes while a runtime fails closed.
      - name: Verify safety runtimes load offline
        run: uv run python scripts/provision_semantic_safety_encoders.py --check-only --verify-runtimes

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      # `npm ci` installs @playwright/test, which contains no browsers, and this
      # project declares no postinstall hook. ship.py runs the Playwright smoke,
      # so without this the gate fails on a missing executable rather than on a
      # real regression. `--with-deps` because the runner is Ubuntu and the
      # browser needs system libraries the image does not carry.
      - name: Provision Playwright browser
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      # ship.py's first step is the breast-monitoring suite, which retrieves
      # against the RAG index and chunk artifact. Both are gitignored and
      # rebuilt from tracked inputs under KnowledgeBase/raw, so on a fresh
      # runner they are simply absent: retrieval scored 19 candidates, the tier
      # filter dropped all 19 for want of ingested chunks, and two tests failed
      # on empty retrieval rather than on anything they were testing.
      #
      # This is the same script quality-gates runs and that bootstrap.py runs
      # for the fresh-clone job, invoked the same way, including the
      # `--check-only` pass that turns "generated nothing" into a failure here
      # rather than a confusing test failure later. Offline: it reads tracked
      # files and writes gitignored ones.
      - name: Provision derived offline artifacts
        run: |
          mkdir -p Data/test_tmp
          uv run python scripts/provision_derived_artifacts.py
          uv run python scripts/provision_derived_artifacts.py --check-only

      # The ship database starts as an empty file with no schema at all, so the
      # progressive-report tests could not log in: demo credentials resolve by
      # looking up the patient row, and with no `patients` table there was
      # nothing to resolve, which surfaced as 401 on /auth/demo-credential-login
      # rather than as a missing-database error.
      #
      # This is the same initializer scripts/run_playwright_backend.py uses for
      # its own disposable database: it applies the Alembic migrations and then
      # seeds the synthetic demo records. It takes the URL from this job's
      # environment, so it can only ever touch the ephemeral SQLite file above.
      #
      # No demo-bootstrap flag is set anywhere: this seeds data, it does not
      # widen the authentication surface, and nothing here is enabled for a
      # deployment profile.
      - name: Initialize the disposable ship database
        run: |
          mkdir -p Data/test_tmp
          uv run python scripts/reset_local_db.py --database-url "$DATABASE_URL"

      # Data/test_tmp is gitignored, so it does not exist on a fresh runner, and
      # DATABASE_URL points the ship database inside it. SQLite does not create
      # missing parents; it fails the connection outright, which took the gate
      # down on its first backend step. Same `mkdir -p` the quality-gates job
      # already uses.
      #
      # ship.py lets its children write straight to this process's stdout and
      # stderr, so the whole run is already in the job log - but reading that
      # log needs admin rights on the repository, which turned a failing gate
      # into an exit code and nothing else. Teeing it to a file makes the same
      # output downloadable as an ordinary artifact.
      #
      # `pipefail` is what keeps that honest: without it the pipeline reports
      # tee's status, tee always succeeds, and a failing gate would go green.
      - name: Run cross-platform ship gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Data/test_tmp
          uv run python scripts/ship.py 2>&1 | tee Data/test_tmp/ship_gate_output.log

      # `always()` because the diagnosis is wanted precisely when the gate
      # fails. An upload step cannot turn a red job green: the gate's own
      # failure is already recorded by the step above.
      #
      # Named files rather than the directory: Data/test_tmp also holds the
      # SQLite databases the run creates, and those are not diagnostics.
      - name: Upload ship gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ship-gate-diagnostics
          path: |
            Data/test_tmp/ship_gate_output.log
            Data/evals/ops/latest_ship_run.json
          if-no-files-found: ignore
          retention-days: 14

      - name: OpenAPI type drift check
        run: uv run python scripts/check_openapi_frontend_types.py
